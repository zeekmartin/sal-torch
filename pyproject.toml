[build-system]
# Pinned, and the upper bound is the point. hatchling 1.33.0 emits
# Metadata-Version 2.5; `packaging` 25.0, the current release, accepts up to
# 2.4, so twine 6.2.0 refuses both the sdist and the wheel with
# "InvalidDistribution: '2.5' is not a valid metadata version". The publish
# workflow does `pip install build twine` and would hit exactly that, after
# the tag had been pushed. Measured rather than assumed: built with 1.27.0 the
# metadata reads 2.4 and `twine check` PASSES on both artifacts, while 1.25
# and 1.24 reject `license = "LicenseRef-BSL-1.1"` outright, so 1.27 is the
# floor as well as the ceiling. Widen this once packaging and twine accept
# 2.5, not before.
requires = ["hatchling>=1.27,<1.28"]
build-backend = "hatchling.build"

[project]
name = "sal-torch"
version = "0.7.0"
description = "Structurally Adaptive Learning — training-time sparsification for robust neural networks"
readme = "README.md"
license = "LicenseRef-BSL-1.1"
requires-python = ">=3.10"
authors = [{ name = "Cognitive Engineering", email = "contact@cognitive-engineering.dev" }]
keywords = ["pytorch", "pruning", "sparsification", "compression", "transformers"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
]
dependencies = ["torch>=2.1", "numpy"]

[project.optional-dependencies]
hf = ["transformers>=4.38"]
reports = ["matplotlib", "fpdf2"]
crypto = ["PyNaCl>=1.5.0"]
quant = ["bitsandbytes>=0.43"]
# ruff carries an upper bound because it is a CI GATE, not a convenience: an
# unpinned linter can fail a build on a day nobody touched the code, which is
# what happened the first time this step ran. `select` in [tool.ruff.lint]
# makes the rule set ours, and the bound keeps a minor release from changing
# what the gate means before anyone has looked.
dev = ["pytest>=7.0", "pytest-cov", "ruff>=0.15,<0.18"]
all = ["sal-torch[hf,reports,crypto,quant,dev]"]

[tool.hatch.build.targets.wheel]
packages = ["sal"]

# The release gate's result cells carry a loss, a gradient norm and a learning
# rate for every one of 40038 optimizer steps, three times over per cell, so
# each file is about 6 MB and the eight cells come to 72 MB. They stay
# committed, because measured data is not thinned to suit a package and they
# are the evidence the gate report cites. They have no business in a pip
# sdist: they took it from 2.4 MB to 28.5 MB for a 150 KB library. Nothing in
# `sal`, `tests`, `experiments` or `scripts` reads them, since the scorer is
# handed paths on its command line, and that was checked before excluding
# them. Excluded by directory rather than by size, so a new cell is excluded
# too. `results/lumi_v060` deliberately stays IN: `results_corrections.py`
# loads `CORRECTIONS.json` out of it, and the test suite shipped inside the
# sdist would fail without it.
[tool.hatch.build.targets.sdist]
exclude = ["/results/gate_v070_*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

# ruff runs in CI as of this commit. It reported 152 findings over 9 rules on
# the tree as it stood; 55 carried meaning and were fixed, 97 are configured
# here. The counts are recorded because a count is the only way to tell a
# deliberate exception from a quiet one later.
#
# Fixed rather than ignored: one F821 (an unresolvable forward reference that
# made typing.get_type_hints() raise on CompressionReport), one F841, three
# F401, and all 50 E741 -- the ambiguous `l`, renamed by token and by scope,
# which is not the same name in every place it appeared.
#
# Ignored because they contradict a deliberate style and not because they are
# inconvenient. 71 E702 and 13 E701 are the compact fixture style: in a test
# fixture, eight assignments on one line read as a block where eight lines
# read as a procedure, and 71 occurrences are a style rather than an
# accident. 7 E401 is the same choice about imports. 3 E731 are lambdas used
# as test doubles, where a def would be longer and no clearer. Turning any of
# them on would mean a 94-line diff across code the v0.7.0 release gate had
# just certified, for no defect.
[tool.ruff]
src = ["sal", "tests"]

# `select` is explicit, and that is the point. Configured with `ignore`
# alone, the rule set is "whatever this version of ruff defaults to, minus
# these four" -- which is not a decision, and it changed under us: the first
# CI run of this lint step passed locally on ruff 0.15.14 and failed on the
# 0.17.6 that pip resolved, with 291 findings across UP, I, RUF, PLR, ISC and
# BLE, because 0.17 widened the default set. A gate whose rules change when a
# dependency releases is not a gate.
#
# E4, E7, E9 and F are ruff's historical default and exactly the set the 152
# findings were reviewed and decided under. Widening it is a separate
# decision with its own diff, not something a version bump should make for
# us: pyupgrade alone would be 94 changes to shipped library code.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E701", "E702", "E401", "E731"]

# Deliberate, not an oversight: these imports follow a sys.path manipulation
# that has to run first, so they cannot move to the top of the file. A
# per-file exception with its reason beside it, rather than switching the
# rule off everywhere.
[tool.ruff.lint.per-file-ignores]
"tests/test_license.py" = ["E402"]

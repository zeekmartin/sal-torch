name: ci

on:
  push:
    # Release branches too. A patch release is cut from a maintenance
    # branch when the tip of main carries surface that the patch must not
    # ship -- v0.7.1 was cut without the ungated pruners -- and a branch
    # whose whole purpose is to be tagged is the last place CI should be
    # optional. Testing it through a pull request would not do: that runs
    # on the branch MERGED into main, which is the tree the release
    # deliberately does not have.
    branches: [main, "release-*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The release gate's provenance test needs two real
          # commits: it builds one staged package from HEAD and
          # another from HEAD~1 and asserts each is an ancestor of
          # what would be published. The default fetch-depth of 1
          # leaves HEAD~1 unresolvable, so the test cannot run.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,reports,crypto]"
      # Lint before the tests, so a lint failure does not consume a test run.
      # The rule set and every exception are configured in pyproject.toml,
      # with their counts and their reasons.
      - run: ruff check sal/ tests/
      - run: pytest tests/ -v
